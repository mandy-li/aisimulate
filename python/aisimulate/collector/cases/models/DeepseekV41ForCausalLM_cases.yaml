schema_version: 1
architecture: DeepseekV41ForCausalLM
model_path: deepseek-ai/DeepSeek-V4.1-Flash
include_base: false
framework_specific_model_case_values:
  sglang:
    dsv41_module:
      - model_path: deepseek-ai/DeepSeek-V4.1-Flash
        tensor_parallel_sizes: [1, 2, 4, 8]
        execution_profiles: [full, decoder_bounded]
  # CRI MoE for DeepSeek-V4.1-Flash. This arch has no shared model_case_values.moe
  # row, so it's declared self-contained here (read only by the XPU backend).
  # sweep "cri" + quant modes live in base_ops/moe.yaml moe_vllm_xpu_cri.
  vllm_xpu_cri:
    moe:
      - model_path: deepseek-ai/DeepSeek-V4.1-Flash
        hidden_size: 5120
        inter_size: 2304
        topk: 6
        num_experts: 384
        sweep: cri
        activation: silu
framework_specific_op_cases:
  sglang:
    dsv41_module:
      cases: all
